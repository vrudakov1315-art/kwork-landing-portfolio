<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Темп — обложка проекта</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body { margin: 0; overflow: hidden; color: #f0f2e9; background: #0a0b09; font-family: Arial, sans-serif; }
      .canvas { position: relative; width: 1920px; height: 1280px; }
      .slash {
        position: absolute; top: -360px; left: 512px; width: 260px; height: 2060px;
        background: #c8ff3d; transform: rotate(21deg);
      }
      .outline {
        position: absolute; z-index: 1; left: -24px; bottom: -82px; margin: 0;
        color: transparent; -webkit-text-stroke: 3px rgba(240,242,233,.24);
        font: 900 420px/.8 Impact, "Arial Black", sans-serif; letter-spacing: -.07em;
      }
      .topline {
        position: absolute; z-index: 7; top: 56px; left: 64px; right: 64px;
        display: flex; justify-content: space-between; border-top: 2px solid #c8ff3d;
        padding-top: 14px; color: #c8ff3d;
        font: 700 17px/1 "Courier New", monospace; letter-spacing: .16em; text-transform: uppercase;
      }
      h1 {
        position: absolute; z-index: 7; left: 62px; top: 165px; margin: 0;
        font: 900 196px/.72 Impact, "Arial Black", sans-serif;
        letter-spacing: -.055em; text-transform: uppercase;
      }
      h1 span { display: block; margin-left: 52px; color: #c8ff3d; }
      .desktop {
        position: absolute; z-index: 3; top: 138px; right: -92px; width: 1380px; height: 930px; margin: 0;
        padding: 15px; background: #191c16; border: 2px solid #c8ff3d;
        clip-path: polygon(12% 0, 100% 0, 88% 100%, 0 100%);
        transform: rotate(-1deg);
      }
      .desktop img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
      .phone {
        position: absolute; z-index: 8; left: 330px; bottom: 44px; width: 304px; height: 668px; margin: 0;
        padding: 12px; background: #0a0b09; border: 4px solid #f0f2e9;
        box-shadow: 18px 18px 0 #c8ff3d; transform: rotate(5deg);
      }
      .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
      .caption {
        position: absolute; z-index: 9; left: 64px; bottom: 74px; width: 265px;
        font: 900 35px/.95 "Arial Black", Arial, sans-serif; text-transform: uppercase;
      }
      .caption small {
        display: block; margin-top: 18px; color: #c8ff3d;
        font: 700 16px/1.35 "Courier New", monospace; letter-spacing: .12em;
      }
      .pace {
        position: absolute; z-index: 9; right: 65px; bottom: 54px; color: #c8ff3d;
        font: 700 22px/1 "Courier New", monospace; letter-spacing: .1em;
      }
    </style>
  </head>
  <body>
    <main class="canvas">
      <div class="slash"></div><div class="outline">ТЕМП</div>
      <div class="topline"><span>Fitness studio</span><span>Сила / Кардио / Мобильность</span></div>
      <h1>Твой<span>темп</span></h1>
      <figure class="desktop"><img src="./desktop.jpg" alt="" /></figure>
      <figure class="phone"><img src="./mobile.jpg" alt="" /></figure>
      <div class="caption">Тренируйся в своём ритме<small>Адаптивный лендинг</small></div>
      <div class="pace">390 ↔ 1440 PX</div>
    </main>
  </body>
</html>
