<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Практика — обложка проекта</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        margin: 0; overflow: hidden; color: #17191f; background: #f5f0e6;
        font-family: "Trebuchet MS", Arial, sans-serif;
      }
      .canvas { position: relative; width: 1920px; height: 1280px; }
      .cobalt { position: absolute; inset: 0 auto 0 0; width: 590px; background: #1236c4; }
      .coral {
        position: absolute; top: -155px; right: -155px; width: 510px; height: 510px;
        border-radius: 50%; background: #ff6d5a;
      }
      .grid {
        position: absolute; inset: 0; opacity: .11;
        background-image: radial-gradient(#17191f 1.5px, transparent 1.5px);
        background-size: 28px 28px;
      }
      .lesson {
        position: absolute; z-index: 3; top: 68px; left: 72px; color: #fffaf0;
        font: 700 20px/1 "Courier New", monospace; letter-spacing: .18em; text-transform: uppercase;
      }
      h1 {
        position: absolute; z-index: 5; left: 72px; top: 176px; width: 490px; margin: 0;
        color: white; font: 900 116px/.84 "Arial Narrow", Arial, sans-serif;
        letter-spacing: -.075em; text-transform: uppercase;
      }
      h1 em { color: #ff6d5a; font-style: normal; }
      .desktop {
        position: absolute; z-index: 2; top: 110px; right: 88px; width: 1220px; height: 802px;
        margin: 0; padding: 16px 16px 64px; background: #fffaf0;
        box-shadow: 24px 28px 0 #17191f; transform: rotate(1.8deg);
      }
      .desktop::after {
        content: "РАЗБОР → ПРАКТИКА → РЕЗУЛЬТАТ"; position: absolute; left: 20px; bottom: 19px;
        font: 700 17px/1 "Courier New", monospace; letter-spacing: .13em;
      }
      .desktop img, .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
      .phone {
        position: absolute; z-index: 6; right: 235px; bottom: 36px; width: 330px; height: 674px;
        margin: 0; padding: 14px; background: #17191f;
        box-shadow: -20px 18px 0 #ff6d5a; transform: rotate(-4deg);
      }
      .tag {
        position: absolute; z-index: 7; left: 74px; bottom: 92px; width: 710px;
        padding: 34px 40px; background: #fffaf0; border: 4px solid #17191f;
        font: 900 42px/1 "Arial Narrow", Arial, sans-serif; text-transform: uppercase;
        transform: rotate(-2deg);
      }
      .tag span {
        display: block; margin-top: 12px; color: #1236c4;
        font: 700 18px/1.2 "Courier New", monospace; letter-spacing: .12em;
      }
      .scribble {
        position: absolute; z-index: 8; right: 48px; bottom: 70px; color: #1236c4;
        font: italic 700 70px/1 Georgia, serif; transform: rotate(-11deg);
      }
    </style>
  </head>
  <body>
    <main class="canvas">
      <div class="cobalt"></div><div class="coral"></div><div class="grid"></div>
      <div class="lesson">Онлайн-курс · 6 недель</div>
      <h1>Прак<em>тика</em></h1>
      <figure class="desktop"><img src="./desktop.jpg" alt="" /></figure>
      <figure class="phone"><img src="./mobile.jpg" alt="" /></figure>
      <div class="tag">Навык через действие<span>Адаптивный лендинг</span></div>
      <div class="scribble">делай →</div>
    </main>
  </body>
</html>
