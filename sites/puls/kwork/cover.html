<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Пульс — обложка проекта</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        margin: 0; overflow: hidden; color: #0a1733;
        background:
          radial-gradient(circle at 84% 19%, rgba(117,103,248,.24), transparent 27%),
          radial-gradient(circle at 11% 78%, rgba(32,167,240,.22), transparent 30%),
          #f7f9ff;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      .canvas { position: relative; width: 1920px; height: 1280px; }
      .orbit {
        position: absolute; top: -280px; right: -160px; width: 1120px; height: 1120px;
        border: 2px solid rgba(117,103,248,.30); border-radius: 50%;
        box-shadow: 0 0 0 94px rgba(32,167,240,.035), 0 0 0 190px rgba(117,103,248,.025);
      }
      .brand {
        position: absolute; top: 62px; left: 76px; display: flex; align-items: center; gap: 14px;
        font: 750 25px/1 "Bahnschrift", Arial, sans-serif;
      }
      .brand i {
        width: 42px; height: 42px; display: block; border-radius: 13px;
        background: linear-gradient(135deg, #20a7f0, #7567f8);
        box-shadow: inset 0 0 0 9px rgba(255,255,255,.8);
      }
      .status {
        position: absolute; top: 70px; right: 78px; color: #187d69;
        font: 700 16px/1 Consolas, monospace; letter-spacing: .1em; text-transform: uppercase;
      }
      .status::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 10px; border-radius: 50%; background: #22bd92; }
      h1 {
        position: absolute; z-index: 5; top: 126px; left: 74px; width: 1160px; margin: 0;
        font: 720 112px/.88 "Bahnschrift", "Arial Narrow", sans-serif;
        letter-spacing: -.06em;
      }
      h1 em { color: #7567f8; font-style: normal; }
      .sub {
        position: absolute; z-index: 5; top: 340px; left: 82px; color: #63708a;
        font: 24px/1.3 "Segoe UI", Arial, sans-serif;
      }
      .desktop {
        position: absolute; z-index: 3; left: 78px; bottom: 62px; width: 1390px; height: 790px;
        margin: 0; padding: 54px 14px 14px; border: 1px solid #dce4f2; border-radius: 26px;
        background: white; box-shadow: 0 36px 90px rgba(28,54,105,.18);
      }
      .desktop::before {
        content: ""; position: absolute; top: 20px; left: 24px; width: 11px; height: 11px;
        border-radius: 50%; background: #ff7e78; box-shadow: 22px 0 #ffd36b, 44px 0 #45cda9;
      }
      .desktop::after {
        content: "app.puls.team"; position: absolute; top: 17px; left: 50%; padding: 6px 190px;
        border-radius: 9px; color: #63708a; background: #f1f5fb;
        font: 13px/1 Consolas, monospace; transform: translateX(-50%);
      }
      .desktop img, .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
      .phone {
        position: absolute; z-index: 7; right: 94px; bottom: 82px; width: 340px; height: 748px;
        margin: 0; padding: 15px; border: 8px solid #0a1733; border-radius: 52px;
        background: #0a1733; box-shadow: -26px 30px 65px rgba(28,54,105,.28);
      }
      .phone img { border-radius: 32px; }
      .chip {
        position: absolute; z-index: 8; right: 314px; top: 404px; padding: 17px 24px;
        border: 1px solid rgba(117,103,248,.25); border-radius: 18px;
        color: #5547d6; background: rgba(255,255,255,.93); box-shadow: 0 16px 40px rgba(28,54,105,.12);
        font: 700 17px/1 Consolas, monospace;
      }
      .caption {
        position: absolute; z-index: 8; right: 100px; top: 190px; width: 350px;
        padding-top: 18px; border-top: 3px solid #20a7f0;
        font: 700 23px/1.2 "Bahnschrift", Arial, sans-serif; text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="canvas">
      <div class="orbit"></div>
      <div class="brand"><i></i>Пульс</div>
      <div class="status">Все системы работают</div>
      <h1>Команда <em>в одном ритме</em></h1>
      <div class="sub">Задачи, решения и прогресс — на одном экране.</div>
      <figure class="desktop"><img src="./desktop.jpg" alt="" /></figure>
      <figure class="phone"><img src="./mobile.jpg" alt="" /></figure>
      <div class="chip">+ 24% к прозрачности</div>
      <div class="caption">Адаптивный лендинг</div>
    </main>
  </body>
</html>
