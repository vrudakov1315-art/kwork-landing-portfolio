<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Север — обложка проекта</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        color: #241d18;
        background:
          radial-gradient(circle at 77% 9%, rgba(255,255,255,.5) 0 18%, transparent 42%),
          repeating-linear-gradient(112deg, rgba(36,29,24,.025) 0 1px, transparent 1px 7px),
          #d6ddd3;
        font-family: Arial, sans-serif;
      }
      .canvas { position: relative; width: 1920px; height: 1280px; }
      .stamp {
        position: absolute; top: 66px; left: 86px;
        width: 148px; height: 148px; display: grid; place-items: center;
        border: 2px solid #9c4f2d; border-radius: 52% 48% 8% 48%;
        color: #9c4f2d; font: italic 700 78px/1 Georgia, serif;
        transform: rotate(-7deg);
      }
      .eyebrow {
        position: absolute; top: 84px; left: 278px; width: 330px;
        font-size: 18px; font-weight: 700; line-height: 1.4;
        letter-spacing: .14em; text-transform: uppercase;
      }
      h1 {
        position: absolute; z-index: 4; top: 232px; left: 82px; margin: 0;
        font: 700 132px/1 Georgia, serif; letter-spacing: -.055em;
        white-space: nowrap;
      }
      .desktop {
        position: absolute; top: 74px; right: 68px; width: 1150px; height: 846px;
        padding: 17px 17px 66px; background: #fffaf2;
        border: 1px solid rgba(36,29,24,.26);
        box-shadow: 28px 36px 0 #33423b;
        transform: rotate(1.1deg);
      }
      .desktop::after {
        content: "sever.coffee  /  desktop";
        position: absolute; left: 24px; bottom: 20px;
        font: 16px/1 "Courier New", monospace; letter-spacing: .08em;
      }
      .desktop img, .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
      .phone {
        position: absolute; z-index: 5; right: 108px; bottom: 62px;
        width: 326px; height: 682px; padding: 18px 14px 26px;
        border: 9px solid #241d18; border-radius: 42px;
        background: #241d18; box-shadow: -18px 25px 0 rgba(156,79,45,.85);
        transform: rotate(3deg);
      }
      .phone::before {
        content: ""; position: absolute; z-index: 2; top: 7px; left: 50%;
        width: 78px; height: 9px; border-radius: 99px; background: #241d18;
        transform: translateX(-50%);
      }
      .phone img { border-radius: 22px; }
      .note {
        position: absolute; left: 84px; bottom: 74px; width: 820px;
        padding: 30px 36px; background: #f3eee5; border-left: 12px solid #9c4f2d;
        font: 700 31px/1.2 Arial, sans-serif; letter-spacing: .01em;
      }
      .note small {
        display: block; margin-top: 12px; color: #5e594f;
        font: 18px/1.3 "Courier New", monospace; letter-spacing: .1em; text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="canvas">
      <div class="stamp">С</div>
      <div class="eyebrow">Лендинг для городской кофейни</div>
      <h1>Север</h1>
      <figure class="desktop"><img src="./desktop.jpg" alt="" /></figure>
      <figure class="phone"><img src="./mobile.jpg" alt="" /></figure>
      <div class="note">
        Кофе, ради которого хочется задержаться
        <small>Адаптивный лендинг</small>
      </div>
    </main>
  </body>
</html>
